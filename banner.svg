<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#151008"/>
      <stop offset="55%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5D777"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#C9960C"/>
    </linearGradient>
    <linearGradient id="lineSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F0C040" stop-opacity="1"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bgGlow)"/>
  <rect width="1200" height="320" fill="url(#scan)"/>

  <circle cx="600" cy="150" r="260" fill="url(#goldGlow)">
    <animate attributeName="r" values="240;280;240" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- particulas doradas flotando -->
  <g fill="#F0C040">
    <circle cx="120" cy="60" r="2"><animate attributeName="cy" values="60;40;60" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="90" r="2.5"><animate attributeName="cy" values="90;60;90" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;1;0.3" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="260" r="1.8"><animate attributeName="cy" values="260;235;260" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="250" r="2.2"><animate attributeName="cy" values="250;225;250" dur="6.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="6.5s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="40" r="1.6"><animate attributeName="cy" values="40;20;40" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.8;0.2" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="100" r="1.5" fill="#2ECC71"><animate attributeName="cy" values="100;80;100" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="130" r="1.8" fill="#00E5FF"><animate attributeName="cy" values="130;110;130" dur="5.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.8;0.2" dur="5.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- emblema: monograma tipo kraken/onda -->
  <g transform="translate(600,108)">
    <circle r="46" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.6"/>
    <circle r="52" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.3">
      <animate attributeName="r" values="52;58;52" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.05;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <path d="M -22 10 Q -14 -22 0 -14 Q 14 -22 22 10 Q 10 22 0 8 Q -10 22 -22 10 Z"
          fill="none" stroke="url(#goldText)" stroke-width="2.4" stroke-linejoin="round"/>
    <circle cx="0" cy="-6" r="3.2" fill="#F0C040"/>
  </g>

  <!-- titulo -->
  <text x="600" y="200" text-anchor="middle" font-family="Arial Black, Arial, sans-serif"
        font-weight="900" font-size="58" letter-spacing="10" fill="url(#goldText)">EAMR</text>

  <line x1="360" y1="222" x2="840" y2="222" stroke="url(#lineSweep)" stroke-width="1.5">
    <animate attributeName="x1" values="600;340;600" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="600;860;600" dur="3.5s" repeatCount="indefinite"/>
  </line>

  <text x="600" y="248" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="13" letter-spacing="4" fill="#D6CCBA" opacity="0.85">
    ESTRATEGA DE ACTIVOS MUSICALES REGISTRABLES
  </text>

  <text x="600" y="278" text-anchor="middle" font-family="Georgia, serif" font-style="italic"
        font-size="12.5" letter-spacing="1.5" fill="#2ECC71" opacity="0.9">
    Composición musical asistida por IA · Licenciamiento comercial
  </text>
</svg>
